services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"   # Qingping devices connect here (office PC IP)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      DB_PATH: /data/climate.db
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto
