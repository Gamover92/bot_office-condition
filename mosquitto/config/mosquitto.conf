# MQTT broker for Qingping devices in the office LAN.
listener 1883 0.0.0.0
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Default: no password (only for a closed office LAN).
allow_anonymous true

# To use a password: run scripts/mqtt-passwd.sh, then
# replace the two lines above/below with:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
